<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charity CRM</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232733;
      --border: #2e3345;
      --text: #e4e6ed;
      --text-dim: #8b8fa3;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --red: #ef4444;
      --red-bg: #2d1618;
      --amber: #f59e0b;
      --amber-bg: #2d2615;
      --green: #22c55e;
      --green-bg: #152d1b;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 12px;
      padding: 16px 24px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 20px;
      min-width: 140px;
      flex: 1;
    }

    .stat-card .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }

    /* Pipeline mini-bar */
    .pipeline-stats {
      display: flex;
      gap: 8px;
      padding: 0 24px 12px;
      flex-wrap: wrap;
    }

    .pipeline-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pipeline-chip:hover, .pipeline-chip.active {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.1);
    }

    .pipeline-chip .count {
      background: var(--border);
      border-radius: 10px;
      padding: 1px 7px;
      font-weight: 600;
      font-size: 11px;
    }

    /* Controls */
    .controls {
      padding: 0 24px 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px 10px 36px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-box input:focus { border-color: var(--accent); }

    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
    }

    select, button {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      outline: none;
      transition: all 0.15s;
    }

    select:hover, button:hover { border-color: var(--accent); }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      font-weight: 500;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }

    /* Table */
    .table-wrapper {
      padding: 0 24px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      background: var(--surface);
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 60px;
      z-index: 50;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    thead th:hover { color: var(--text); }
    thead th .sort-arrow { margin-left: 4px; font-size: 10px; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    tbody tr:hover { background: var(--surface); }

    td {
      padding: 10px 12px;
      vertical-align: top;
      max-width: 250px;
    }

    .td-name {
      font-weight: 500;
      color: var(--accent-hover);
      cursor: pointer;
    }

    .td-name:hover { text-decoration: underline; }

    .td-email, .td-phone { font-family: 'SF Mono', Monaco, monospace; font-size: 12px; }

    .td-truncate {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* RAG badges */
    .rag-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .rag-badge:hover { transform: scale(1.4); }

    .rag-red { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .rag-amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
    .rag-green { background: var(--green); box-shadow: 0 0 6px var(--green); }

    /* Pipeline badges */
    .pipeline-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }

    .pipeline-Lead { background: var(--red-bg); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
    .pipeline-Contacted { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
    .pipeline-Meeting { background: rgba(34,87,158,0.15); color: #60a5fa; border: 1px solid rgba(96,165,250,0.3); }
    .pipeline-Proposal { background: rgba(124,58,237,0.15); color: #a78bfa; border: 1px solid rgba(167,139,250,0.3); }
    .pipeline-Won { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .pipeline-Lost { background: rgba(100,100,100,0.15); color: #888; border: 1px solid rgba(100,100,100,0.3); }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .pagination-buttons {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      padding: 6px 12px;
      min-width: 36px;
      text-align: center;
    }

    .page-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 90%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 24px;
      cursor: pointer;
      padding: 0;
    }

    .modal-close:hover { color: var(--text); }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group.full { grid-column: 1 / -1; }

    .form-group label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      font-weight: 500;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--accent); }

    .form-group textarea { min-height: 80px; resize: vertical; }

    .form-group .readonly {
      background: var(--surface2);
      color: var(--text-dim);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* RAG selector in modal */
    .rag-selector {
      display: flex;
      gap: 12px;
    }

    .rag-option {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      border: 2px solid transparent;
      font-size: 13px;
      transition: all 0.15s;
    }

    .rag-option.selected { border-color: currentColor; }

    .rag-option.opt-red { color: var(--red); background: var(--red-bg); }
    .rag-option.opt-amber { color: var(--amber); background: var(--amber-bg); }
    .rag-option.opt-green { color: var(--green); background: var(--green-bg); }

    /* Checkbox for bulk */
    .row-check {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    /* Bulk actions bar */
    .bulk-bar {
      display: none;
      padding: 10px 24px;
      background: var(--accent);
      color: white;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      font-weight: 500;
    }

    .bulk-bar.active { display: flex; }

    .bulk-bar select, .bulk-bar button {
      background: rgba(255,255,255,0.15);
      color: white;
      border-color: rgba(255,255,255,0.3);
    }

    /* Income formatting */
    .money { font-variant-numeric: tabular-nums; }
    .money-pos { color: var(--green); }

    /* Responsive */
    @media (max-width: 768px) {
      .stats-bar { flex-direction: column; }
      .form-grid { grid-template-columns: 1fr; }
      .controls { flex-direction: column; }
      .search-box { min-width: 100%; }
    }

    /* Loading spinner */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: var(--text-dim);
      gap: 10px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }

    .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
  </style>
</head>
<body>

  <div class="header">
    <h1>Charity CRM</h1>
    <div class="header-actions">
      <button onclick="exportCSV()">Export CSV</button>
    </div>
  </div>

  <div class="stats-bar" id="statsBar"></div>

  <div class="pipeline-stats" id="pipelineStats"></div>

  <div class="bulk-bar" id="bulkBar">
    <span id="bulkCount">0 selected</span>
    <select id="bulkPipeline">
      <option value="">Set Pipeline...</option>
      <option value="Lead">Lead</option>
      <option value="Contacted">Contacted</option>
      <option value="Meeting Booked">Meeting Booked</option>
      <option value="Proposal Sent">Proposal Sent</option>
      <option value="Won">Won</option>
      <option value="Lost">Lost</option>
    </select>
    <select id="bulkRag">
      <option value="">Set RAG...</option>
      <option value="red">Red</option>
      <option value="amber">Amber</option>
      <option value="green">Green</option>
    </select>
    <button onclick="applyBulkUpdate()">Apply</button>
    <button onclick="clearSelection()">Clear</button>
  </div>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by name, email, phone, postcode..." />
    </div>
    <select id="filterPipeline">
      <option value="">All Stages</option>
      <option value="Lead">Lead</option>
      <option value="Contacted">Contacted</option>
      <option value="Meeting Booked">Meeting Booked</option>
      <option value="Proposal Sent">Proposal Sent</option>
      <option value="Won">Won</option>
      <option value="Lost">Lost</option>
    </select>
    <select id="filterRag">
      <option value="">All RAG</option>
      <option value="red">Red</option>
      <option value="amber">Amber</option>
      <option value="green">Green</option>
    </select>
    <select id="filterContact">
      <option value="">Email & Phone</option>
      <option value="email">Has Email</option>
      <option value="phone">Has Phone</option>
    </select>
    <select id="perPage">
      <option value="25">25 / page</option>
      <option value="50">50 / page</option>
      <option value="100">100 / page</option>
    </select>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width:30px"><input type="checkbox" class="row-check" id="selectAll" /></th>
          <th data-sort="charity_name">Name <span class="sort-arrow"></span></th>
          <th data-sort="email">Email <span class="sort-arrow"></span></th>
          <th data-sort="phone">Phone <span class="sort-arrow"></span></th>
          <th data-sort="postcode">Postcode <span class="sort-arrow"></span></th>
          <th data-sort="income">Income <span class="sort-arrow"></span></th>
          <th data-sort="pipeline_stage">Pipeline <span class="sort-arrow"></span></th>
          <th data-sort="rag_status">RAG <span class="sort-arrow"></span></th>
          <th data-sort="last_contacted">Last Contacted <span class="sort-arrow"></span></th>
          <th>Notes</th>
          <th style="width:60px">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="11" class="loading"><div class="spinner"></div> Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>

  <!-- Detail/Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h2>
        <span id="modalTitle">Charity Details</span>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </h2>
      <div class="form-grid">
        <div class="form-group full">
          <label>Charity Name</label>
          <input type="text" id="mName" class="readonly" readonly />
        </div>
        <div class="form-group">
          <label>Charity Number</label>
          <input type="text" id="mCharityNum" class="readonly" readonly />
        </div>
        <div class="form-group">
          <label>Registration Status</label>
          <input type="text" id="mRegStatus" class="readonly" readonly />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="text" id="mEmail" class="readonly" readonly />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="mPhone" class="readonly" readonly />
        </div>
        <div class="form-group">
          <label>Website</label>
          <input type="text" id="mWeb" class="readonly" readonly />
        </div>
        <div class="form-group">
          <label>Postcode</label>
          <input type="text" id="mPostcode" class="readonly" readonly />
        </div>
        <div class="form-group full">
          <label>Address</label>
          <input type="text" id="mAddress" class="readonly" readonly />
        </div>
        <div class="form-group">
          <label>Income</label>
          <input type="text" id="mIncome" class="readonly" readonly />
        </div>
        <div class="form-group">
          <label>Expenditure</label>
          <input type="text" id="mExpenditure" class="readonly" readonly />
        </div>
        <hr style="grid-column:1/-1; border-color: var(--border);" />
        <div class="form-group">
          <label>Pipeline Stage</label>
          <select id="mPipeline">
            <option value="Lead">Lead</option>
            <option value="Contacted">Contacted</option>
            <option value="Meeting Booked">Meeting Booked</option>
            <option value="Proposal Sent">Proposal Sent</option>
            <option value="Won">Won</option>
            <option value="Lost">Lost</option>
          </select>
        </div>
        <div class="form-group">
          <label>Last Contacted</label>
          <input type="date" id="mLastContacted" />
        </div>
        <div class="form-group full">
          <label>RAG Status</label>
          <div class="rag-selector" id="mRagSelector">
            <div class="rag-option opt-red" data-rag="red" onclick="selectRag('red')">● Red</div>
            <div class="rag-option opt-amber" data-rag="amber" onclick="selectRag('amber')">● Amber</div>
            <div class="rag-option opt-green" data-rag="green" onclick="selectRag('green')">● Green</div>
          </div>
        </div>
        <div class="form-group">
          <label>Assigned To</label>
          <input type="text" id="mAssigned" placeholder="e.g. Ross" />
        </div>
        <div class="form-group full">
          <label>Notes</label>
          <textarea id="mNotes" placeholder="Add notes about this charity..."></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="saveCharity()">Save Changes</button>
      </div>
    </div>
  </div>

<script>
// State
let currentPage = 1;
let currentSort = 'charity_name';
let currentSortDir = 'asc';
let selectedIds = new Set();
let editingId = null;
let modalRag = 'red';
let stats = {};
let debounceTimer = null;

// API helper
async function api(url, options = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  return res.json();
}

// Format money
function fmtMoney(val) {
  if (val == null) return '-';
  return '£' + Number(val).toLocaleString('en-GB', { maximumFractionDigits: 0 });
}

// Pipeline badge class
function pipelineClass(stage) {
  if (!stage) return 'pipeline-Lead';
  return 'pipeline-' + stage.split(' ')[0];
}

// Load stats
async function loadStats() {
  stats = await api('/api/stats');
  const bar = document.getElementById('statsBar');
  const pipelineMap = {};
  (stats.pipeline || []).forEach(p => pipelineMap[p.pipeline_stage] = p.count);

  bar.innerHTML = `
    <div class="stat-card">
      <div class="label">Total Charities</div>
      <div class="value">${(stats.total || 0).toLocaleString()}</div>
    </div>
    <div class="stat-card">
      <div class="label">Contacted</div>
      <div class="value">${(stats.contacted || 0).toLocaleString()}</div>
    </div>
    <div class="stat-card">
      <div class="label">In Pipeline</div>
      <div class="value">${((stats.total || 0) - (pipelineMap['Lead'] || 0)).toLocaleString()}</div>
    </div>
    <div class="stat-card">
      <div class="label">Won</div>
      <div class="value" style="color:var(--green)">${(pipelineMap['Won'] || 0).toLocaleString()}</div>
    </div>
  `;

  // Pipeline chips
  const stages = ['Lead', 'Contacted', 'Meeting Booked', 'Proposal Sent', 'Won', 'Lost'];
  const pStats = document.getElementById('pipelineStats');
  const activePipeline = document.getElementById('filterPipeline').value;
  pStats.innerHTML = stages.map(s =>
    `<div class="pipeline-chip ${activePipeline === s ? 'active' : ''}" onclick="filterByPipeline('${s}')">
      <span class="pipeline-badge ${pipelineClass(s)}">${s}</span>
      <span class="count">${(pipelineMap[s] || 0).toLocaleString()}</span>
    </div>`
  ).join('');
}

// Filter by clicking pipeline chip
function filterByPipeline(stage) {
  const el = document.getElementById('filterPipeline');
  el.value = el.value === stage ? '' : stage;
  currentPage = 1;
  loadData();
}

// Load data
async function loadData() {
  const search = document.getElementById('searchInput').value;
  const pipeline = document.getElementById('filterPipeline').value;
  const rag = document.getElementById('filterRag').value;
  const contact = document.getElementById('filterContact').value;
  const limit = document.getElementById('perPage').value;

  const params = new URLSearchParams({
    page: currentPage,
    limit,
    sortBy: currentSort,
    sortDir: currentSortDir,
  });

  if (search) params.set('search', search);
  if (pipeline) params.set('pipeline', pipeline);
  if (rag) params.set('rag', rag);
  if (contact === 'email') params.set('hasEmail', 'true');
  if (contact === 'phone') params.set('hasPhone', 'true');

  const body = document.getElementById('tableBody');
  body.innerHTML = `<tr><td colspan="11" class="loading"><div class="spinner"></div> Loading...</td></tr>`;

  const result = await api(`/api/charities?${params}`);
  renderTable(result.data);
  renderPagination(result.pagination);
  loadStats();
}

// Render table rows
function renderTable(rows) {
  const body = document.getElementById('tableBody');

  if (!rows || rows.length === 0) {
    body.innerHTML = `<tr><td colspan="11" class="empty-state"><h3>No charities found</h3>Try adjusting your search or filters</td></tr>`;
    return;
  }

  body.innerHTML = rows.map(r => `
    <tr data-id="${r.id}">
      <td><input type="checkbox" class="row-check" ${selectedIds.has(r.id) ? 'checked' : ''} onchange="toggleSelect(${r.id}, this.checked)" /></td>
      <td class="td-name td-truncate" onclick="openModal(${r.id})" title="${esc(r.charity_name)}">${esc(r.charity_name)}</td>
      <td class="td-email td-truncate" title="${esc(r.email)}">${r.email ? `<a href="mailto:${esc(r.email)}" style="color:var(--accent-hover);text-decoration:none">${esc(r.email)}</a>` : '<span style="color:var(--text-dim)">-</span>'}</td>
      <td class="td-phone">${r.phone ? `<a href="tel:${esc(r.phone)}" style="color:var(--text);text-decoration:none">${esc(r.phone)}</a>` : '<span style="color:var(--text-dim)">-</span>'}</td>
      <td>${esc(r.postcode) || '-'}</td>
      <td class="money">${fmtMoney(r.income)}</td>
      <td><span class="pipeline-badge ${pipelineClass(r.pipeline_stage)}">${esc(r.pipeline_stage)}</span></td>
      <td style="text-align:center"><span class="rag-badge rag-${r.rag_status}" onclick="quickRag(${r.id}, '${r.rag_status}')" title="Click to cycle RAG"></span></td>
      <td>${r.last_contacted || '<span style="color:var(--text-dim)">Never</span>'}</td>
      <td class="td-truncate" title="${esc(r.notes)}">${esc(r.notes) || '<span style="color:var(--text-dim)">-</span>'}</td>
      <td><button class="btn-sm" onclick="openModal(${r.id})">Edit</button></td>
    </tr>
  `).join('');
}

// Escape HTML
function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Quick RAG cycle
async function quickRag(id, current) {
  const cycle = { red: 'amber', amber: 'green', green: 'red' };
  const next = cycle[current] || 'red';
  await api(`/api/charities/${id}`, {
    method: 'PATCH',
    body: JSON.stringify({ rag_status: next }),
  });
  loadData();
}

// Pagination
function renderPagination(p) {
  const el = document.getElementById('pagination');
  const start = (p.page - 1) * p.limit + 1;
  const end = Math.min(p.page * p.limit, p.total);

  let buttons = '';
  const maxButtons = 7;
  let startPage = Math.max(1, p.page - 3);
  let endPage = Math.min(p.totalPages, startPage + maxButtons - 1);
  if (endPage - startPage < maxButtons - 1) startPage = Math.max(1, endPage - maxButtons + 1);

  buttons += `<button class="page-btn" ${p.page <= 1 ? 'disabled' : ''} onclick="goPage(${p.page - 1})">‹</button>`;

  if (startPage > 1) {
    buttons += `<button class="page-btn" onclick="goPage(1)">1</button>`;
    if (startPage > 2) buttons += `<span style="padding:0 4px;color:var(--text-dim)">...</span>`;
  }

  for (let i = startPage; i <= endPage; i++) {
    buttons += `<button class="page-btn ${i === p.page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }

  if (endPage < p.totalPages) {
    if (endPage < p.totalPages - 1) buttons += `<span style="padding:0 4px;color:var(--text-dim)">...</span>`;
    buttons += `<button class="page-btn" onclick="goPage(${p.totalPages})">${p.totalPages}</button>`;
  }

  buttons += `<button class="page-btn" ${p.page >= p.totalPages ? 'disabled' : ''} onclick="goPage(${p.page + 1})">›</button>`;

  el.innerHTML = `
    <span>Showing ${start.toLocaleString()}-${end.toLocaleString()} of ${p.total.toLocaleString()}</span>
    <div class="pagination-buttons">${buttons}</div>
  `;
}

function goPage(page) {
  currentPage = page;
  loadData();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Sorting
document.querySelectorAll('thead th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const sort = th.dataset.sort;
    if (currentSort === sort) {
      currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
    } else {
      currentSort = sort;
      currentSortDir = 'asc';
    }
    // Update arrows
    document.querySelectorAll('.sort-arrow').forEach(a => a.textContent = '');
    th.querySelector('.sort-arrow').textContent = currentSortDir === 'asc' ? '▲' : '▼';
    currentPage = 1;
    loadData();
  });
});

// Search with debounce
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    currentPage = 1;
    loadData();
  }, 300);
});

// Filter changes
['filterPipeline', 'filterRag', 'filterContact', 'perPage'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    currentPage = 1;
    loadData();
  });
});

// Selection
function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  updateBulkBar();
}

document.getElementById('selectAll').addEventListener('change', function() {
  const checks = document.querySelectorAll('tbody .row-check');
  checks.forEach(c => {
    c.checked = this.checked;
    const id = parseInt(c.closest('tr').dataset.id);
    if (this.checked) selectedIds.add(id); else selectedIds.delete(id);
  });
  updateBulkBar();
});

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  if (selectedIds.size > 0) {
    bar.classList.add('active');
    document.getElementById('bulkCount').textContent = `${selectedIds.size} selected`;
  } else {
    bar.classList.remove('active');
  }
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('.row-check').forEach(c => c.checked = false);
  updateBulkBar();
}

async function applyBulkUpdate() {
  const updates = {};
  const pipeline = document.getElementById('bulkPipeline').value;
  const rag = document.getElementById('bulkRag').value;
  if (pipeline) updates.pipeline_stage = pipeline;
  if (rag) updates.rag_status = rag;
  if (Object.keys(updates).length === 0) return;

  await api('/api/charities/bulk/update', {
    method: 'PATCH',
    body: JSON.stringify({ ids: Array.from(selectedIds), updates }),
  });

  clearSelection();
  document.getElementById('bulkPipeline').value = '';
  document.getElementById('bulkRag').value = '';
  loadData();
}

// Modal
async function openModal(id) {
  editingId = id;
  const r = await api(`/api/charities/${id}`);

  document.getElementById('modalTitle').textContent = r.charity_name;
  document.getElementById('mName').value = r.charity_name || '';
  document.getElementById('mCharityNum').value = r.charity_number || '';
  document.getElementById('mRegStatus').value = r.registration_status || '';
  document.getElementById('mEmail').value = r.email || '';
  document.getElementById('mPhone').value = r.phone || '';
  document.getElementById('mWeb').value = r.website || '';
  document.getElementById('mPostcode').value = r.postcode || '';
  document.getElementById('mAddress').value = r.address || '';
  document.getElementById('mIncome').value = r.income != null ? fmtMoney(r.income) : '';
  document.getElementById('mExpenditure').value = r.expenditure != null ? fmtMoney(r.expenditure) : '';
  document.getElementById('mPipeline').value = r.pipeline_stage || 'Lead';
  document.getElementById('mLastContacted').value = r.last_contacted || '';
  document.getElementById('mAssigned').value = r.assigned_to || '';
  document.getElementById('mNotes').value = r.notes || '';

  selectRag(r.rag_status || 'red');
  document.getElementById('editModal').classList.add('active');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('active');
  editingId = null;
}

function selectRag(rag) {
  modalRag = rag;
  document.querySelectorAll('#mRagSelector .rag-option').forEach(el => {
    el.classList.toggle('selected', el.dataset.rag === rag);
  });
}

async function saveCharity() {
  if (!editingId) return;

  const data = {
    pipeline_stage: document.getElementById('mPipeline').value,
    rag_status: modalRag,
    last_contacted: document.getElementById('mLastContacted').value || null,
    assigned_to: document.getElementById('mAssigned').value,
    notes: document.getElementById('mNotes').value,
  };

  await api(`/api/charities/${editingId}`, {
    method: 'PATCH',
    body: JSON.stringify(data),
  });

  closeModal();
  loadData();
}

// Close modal on escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// Close modal on overlay click
document.getElementById('editModal').addEventListener('click', e => {
  if (e.target === document.getElementById('editModal')) closeModal();
});

// Export
function exportCSV() {
  window.location.href = '/api/export/csv';
}

// Initial load
loadData();
</script>
